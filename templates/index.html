<!DOCTYPE html>
<html>
<head>
    <title>NL Query System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #2f2f46;
            padding: 30px;
            border-radius: 12px;
            width: 600px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 65%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        button {
            padding: 10px 15px;
            margin-left: 10px;
            border: none;
            border-radius: 6px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #45a049;
        }

        #output {
            margin-top: 20px;
            text-align: left;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #1e1e2f;
        }

        th, td {
            padding: 8px;
            border: 1px solid #444;
            text-align: center;
        }

        th {
            background: #4CAF50;
        }

        .sql-box {
            background: #1e1e2f;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>NL Query System</h2>

    <input id="query" placeholder="e.g. top students">
    <button onclick="sendQuery()">Submit</button>

    <div id="output"></div>
</div>

<script>
// escape text before putting it into the page
function esc(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
}

function sendQuery() {
    const query = document.getElementById("query").value;
    const out = document.getElementById("output");

    fetch("/query", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({query: query})
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            out.innerHTML = "<p style='color:#ff6b6b'>" + esc(data.error) + "</p>";
            return;
        }

        let html = "<div class='sql-box'><b>SQL:</b> " + esc(data.sql) + "</div>";

        if (data.rows.length === 0) {
            out.innerHTML = html + "<p>No students match that.</p>";
            return;
        }

        // column names come from the query, so averages and counts show up properly too
        html += "<table><tr>";
        data.columns.forEach(col => { html += "<th>" + esc(col) + "</th>"; });
        html += "</tr>";

        data.rows.forEach(row => {
            html += "<tr>";
            row.forEach(cell => { html += "<td>" + esc(cell) + "</td>"; });
            html += "</tr>";
        });

        out.innerHTML = html + "</table>";
    })
    .catch(() => {
        out.innerHTML = "<p style='color:#ff6b6b'>Couldn't reach the server.</p>";
    });
}

// Enter key works the same as the button
document.getElementById("query").addEventListener("keydown", e => {
    if (e.key === "Enter") sendQuery();
});
</script>

</body>
</html>
